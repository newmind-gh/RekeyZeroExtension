name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: Install extension
        working-directory: apps/extension
        run: npm ci
      - name: Test extension
        working-directory: apps/extension
        run: npm test
      - name: Check extension
        working-directory: apps/extension
        run: npm run check
      - name: Install browser runtime
        if: github.event_name != 'pull_request'
        working-directory: apps/extension
        run: npx playwright install --with-deps chromium
      - name: Build and scan release artifacts
        if: github.event_name != 'pull_request'
        working-directory: apps/extension
        run: npm run release
      - name: Validate packaged extension in Chromium
        if: github.event_name != 'pull_request'
        working-directory: apps/extension
        env:
          REKEYZERO_EXTENSION_OUTPUT_DIRECTORY: ${{ runner.temp }}/rekeyzero-release
        run: |
          unzip -q ../../dist/rekeyzero-personal.zip -d "$REKEYZERO_EXTENSION_OUTPUT_DIRECTORY"
          xvfb-run --auto-servernum npx playwright test tests/personal-orchestration.e2e.ts tests/control-adapters.e2e.ts
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: extension-release-candidates
          path: |
            dist/rekeyzero-personal.zip
            dist/rekeyzero-personal.manifest.json
            dist/rekeyzero-personal.sha256
          if-no-files-found: error
